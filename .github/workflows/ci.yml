name: CI Pipeline

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  # job 1
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci
      
      - name: Run OXlint
        run: npm run lint
      
      - name: Check Prettier Formatting
        run: npm run format:check

      - name: Build Project
        run: npm run build

      # NOT IMPLIMENTED YET
      # - name: Run Tests
      #   run: npm run test:run

      - name: Build Docker Image
        run: docker build -t myw-client -f Dockerfile .

  # job 2
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Check Prettier Formatting
        run: npm run format:check

      # NOT IMPLIMENTED YET
      # - name: Run Tests
      #   run: npm run test:run

      # - name: Build Docker Image
      #   run: docker build -t <imagename> .
